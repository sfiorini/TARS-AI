<div class="tab-pane fade" id="movements" role="tabpanel">
  <div class="me-studio-layout">
    <div class="me-library body-panel">
      <div class="me-toolbar">
        <input id="meLibSearch" class="hud-input" type="search" placeholder="Search movements…" aria-label="Search movements">
        <div id="meLibTypeFilter" class="me-type-filter" role="group" aria-label="Filter movement type">
          <button type="button" data-type="all" aria-pressed="true">All</button>
          <button type="button" data-type="legs_only" aria-pressed="false">Legs</button>
          <button type="button" data-type="has_arms" aria-pressed="false">Arms</button>
        </div>
        <select id="meLibSort" class="hud-select" aria-label="Sort movements">
          <option value="id" selected>id A–Z</option><option value="name">name A–Z</option><option value="type">type</option>
        </select>
        <span id="meLibCount" class="me-lib-count" aria-live="polite"></span>
        <button type="button" id="meNewBtn" class="hud-btn hud-btn-primary">+ Create</button>
        <button type="button" id="meResetBtn" class="hud-btn hud-btn-secondary" title="Restore every default movement; user movements are kept">↺ Reset</button>
        <button type="button" id="mePruneBtn" class="hud-btn hud-btn-danger" title="Reset AND delete movements that no longer exist in the defaults">✂ Prune</button>
      </div>
      <div id="meConfirmStrip" class="me-confirm-strip bld-overwrite-confirm" role="status" aria-live="polite" hidden></div>
      <div id="meDraftBanner" class="me-draft-banner" hidden></div>
      <div id="meLibList" class="me-lib-list" aria-live="polite">Loading…</div>
    </div>
    <section id="meEditor" class="me-editor body-panel" hidden aria-label="Movement editor">
      <header class="me-editor-header">
        <button id="meBackBtn" type="button" class="hud-btn hud-btn-secondary" title="Back to library">‹ Back to library</button>
        <h2 id="meEditorTitle">New movement</h2>
        <span id="meDirtyDot" class="me-dirty-dot" hidden aria-label="Unsaved changes">●</span>
        <span id="meBusyChip" class="me-busy-chip" role="status" hidden></span>
        <span id="meServoOfflineChip" class="me-servo-offline-chip" role="status" hidden>Servo controller offline</span>
        <button id="mePlayBtn" type="button" class="hud-btn hud-btn-primary me-play-button">PLAY BASE</button>
        <button id="meModeVisual" type="button" class="hud-btn hud-btn-secondary" aria-pressed="true">VISUAL</button>
        <button id="meModeRaw" type="button" class="hud-btn hud-btn-secondary" aria-pressed="false">RAW</button>
        <div class="me-overflow-wrap">
          <button id="meOverflowBtn" type="button" class="hud-btn hud-btn-secondary" aria-label="Editor actions" aria-expanded="false">⋯</button>
          <div id="meOverflowMenu" class="me-overflow-menu" role="menu" hidden></div>
        </div>
        <button id="meSaveBtn" type="button" class="hud-btn hud-btn-primary" data-state="CLEAN">SAVE</button>
      </header>
      <div class="me-metadata-grid">
        <label class="me-id-field">Movement id
          <span id="meIdEdit"><input id="meIdInput" class="hud-input" autocomplete="off"><span id="meIdLock" class="me-id-lock" hidden></span></span>
          <span id="meIdHint">a–z 0–9 _</span>
          <span id="meIdError" class="me-field-error" aria-live="polite"></span>
        </label>
        <label>Display name<input id="meNameInput" class="hud-input" autocomplete="off"></label>
        <label>Type<select id="meTypeSelect" class="hud-select"><option value="legs_only">legs_only</option><option value="has_arms">has_arms</option></select></label>
        <label class="me-description-field">Description<input id="meDescInput" class="hud-input" autocomplete="off"><small>The voice assistant reads this when choosing a movement — say what it does.</small></label>
      </div>
      <div id="meTypeNotice" class="me-type-notice" role="status" aria-live="polite"></div>
      <div id="meErrorStrip" class="me-error-strip bld-overwrite-confirm" role="alert" aria-live="assertive" hidden></div>
      <div id="meRawPanel" class="me-raw-panel" hidden>
        <label for="meRawText">Full movement JSON</label>
        <textarea id="meRawText" class="hud-input" spellcheck="false" aria-label="Raw movement JSON"></textarea>
        <div class="me-raw-actions"><button id="meRawApply" type="button" class="hud-btn hud-btn-primary">Apply JSON</button></div>
        <div id="meRawNotice" class="me-raw-notice" role="status" aria-live="polite"></div>
      </div>
      <div class="me-editor-workspace">
        <section class="me-timeline-panel" aria-label="Movement timeline">
          <div class="me-branch-bar" role="group" aria-label="Movement branch">
            <button id="meBranchBase" type="button" class="hud-btn hud-btn-secondary" data-branch="steps" aria-pressed="true">
              <span>BASE</span><small>plays when arms are absent</small>
            </button>
            <button id="meBranchArms" type="button" class="hud-btn hud-btn-secondary" data-branch="steps_arms" aria-pressed="false">
              <span>ARMS</span><small>plays when arms are installed</small>
            </button>
          </div>
          <div id="meBranchStatus" class="me-branch-status" role="status" aria-live="polite"></div>
          <div id="meTimeline" class="me-timeline"></div>
          <div class="me-timeline-actions">
            <button id="meAddStep" type="button" class="hud-btn hud-btn-secondary">+ Position</button>
            <button id="meClearBranch" type="button" class="hud-btn hud-btn-danger">Clear BASE</button>
            <select id="meImportSelect" class="hud-select" aria-label="Movement to import"></select>
            <button id="meImportReplace" type="button" class="hud-btn hud-btn-secondary">Import into BASE</button>
            <button id="meImportAppend" type="button" class="hud-btn hud-btn-secondary">Import into BASE (append)</button>
            <select id="meRefSelect" class="hud-select" aria-label="Named movement to reference"></select>
            <button id="meAddRef" type="button" class="hud-btn hud-btn-secondary">+ Ref step</button>
          </div>
        </section>
        <section id="mePosePanel" class="me-pose-panel" aria-label="Pose editor"></section>
      </div>
    </section>
  </div>
</div>
