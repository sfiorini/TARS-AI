name: docs

on:
  push:
    branches: [V3]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - 'src/tests/**'
      - 'pytest.ini'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # sounddevice loads the system PortAudio shared library at import time and
      # initializes a host API, so the headless runner needs libportaudio2 plus
      # a running PulseAudio server (no audio hardware on CI runners).
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 pulseaudio
      - run: pulseaudio --start --exit-idle-time=-1
      # Tests import app modules at collection time: module_config needs
      # python-dotenv, module_llm/module_vision need requests, and
      # module_stt/module_mic/module_tts need numpy, sounddevice, soundfile,
      # soxr. Hardware libs (board/busio/adafruit_pca9685) are stubbed by the
      # tests themselves, so they are not installed here.
      - run: pip install pytest python-dotenv numpy requests sounddevice soundfile soxr
      - run: python -m pytest src/tests -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
